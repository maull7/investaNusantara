name: Deploy NusantaraNews to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy ke VPS (Docker)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ${{ secrets.SERVER_PATH }}

            echo "Pull code"
            git pull origin main

            # Folder socket web untuk Nginx host (sekali; Docker membuatnya milik root bila belum ada).
            install -d -m 0777 socket

            echo "Build & restart container (app migrasi otomatis; gagal jika app tidak healthy)"
            # --wait: tunggu healthcheck app lolos (maks 5 menit) sebelum lanjut.
            docker compose up -d --build --remove-orphans --wait --wait-timeout 300

            echo "Cek health"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors --unix-socket socket/app.sock http://localhost/up >/dev/null
            echo "App sehat di socket/app.sock"
            docker compose ps

            echo "Bersihkan image lama"
            docker image prune -f
