name: Deploy NusantaraNews to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy ke VPS (Docker)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ${{ secrets.SERVER_PATH }}

            echo "Pull code"
            git pull origin main

            echo "Build & restart container (app migrasi otomatis; gagal jika app tidak healthy)"
            # --wait: tunggu healthcheck app lolos (maks 5 menit) sebelum lanjut.
            docker compose up -d --build --remove-orphans --wait --wait-timeout 300

            echo "Cek health"
            # Default 6003 harus sama dengan docker-compose.yml; buang kutip/spasi/CR dari .env.
            APP_PORT="$(grep -E '^APP_PORT=' .env | tail -n1 | cut -d= -f2 | tr -d "\"' \r")"
            APP_PORT="${APP_PORT:-6003}"
            curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "http://127.0.0.1:${APP_PORT}/up" >/dev/null
            echo "App sehat di port ${APP_PORT}"
            docker compose ps

            echo "Bersihkan image lama"
            docker image prune -f
