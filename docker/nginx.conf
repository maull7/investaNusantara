# Nginx site for the host. The app opens no TCP port: Nginx proxies to the unix socket
# that the `app` container creates in <project>/socket/app.sock.
#
#   sudo cp docker/nginx.conf /etc/nginx/sites-available/investanusantara
#   sudo sed -i 's/DOMAIN/domain-anda.com/g; s#PROJECT#/var/www/investanusantara#g' /etc/nginx/sites-available/investanusantara
#   sudo ln -sf /etc/nginx/sites-available/investanusantara /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: run `sudo certbot --nginx -d DOMAIN -d www.DOMAIN` once; certbot adds the 443 block.

upstream investanusantara_app {
    server unix:PROJECT/socket/app.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    client_max_body_size 10m;

    location / {
        proxy_pass http://investanusantara_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 120s;
    }
}
